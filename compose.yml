services:
  amt:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/minbzk/amt:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    env_file:
      - path: prod.env
        required: true
    environment:
      - ENVIRONMENT=local
    ports:
      - 8070:8000
    healthcheck:
      # Python instead of curl: the production image is a clean python:slim
      # without curl, so the check uses the interpreter that is always present.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status==200 else 1)",
        ]

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
      - ./database/:/docker-entrypoint-initdb.d/:cached
    env_file:
      - path: prod.env
        required: true
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "amt", "-U", "amt"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
    ports:
      - 5432:5432

  db-admin:
    image: dpage/pgadmin4:8.6
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - PGADMIN_LISTEN_PORT=${PGADMIN_LISTEN_PORT:-8080}
    env_file:
      - path: prod.env
        required: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:8080/misc/ping"]

  # Local dev identity provider (demo/demo), requires '127.0.0.1 keycloak' in /etc/hosts. See BUILD.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command:
      [
        "start-dev",
        "--import-realm",
        "--http-port=8180",
        "--hostname=http://keycloak:8180",
      ]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - 8180:8180
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180'"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s

volumes:
  app-db-data:
