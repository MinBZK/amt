timeout: 10m
exit-code: 1
severity:
  - HIGH
  - CRITICAL

scan:
  scanners:
    - vuln
    - misconfig
    - secret

pkg:
  types:
    - library
    - os
  ignore-unfixed: true

db:
  # Tried in order; public.ecr.aws alone hit TOOMANYREQUESTS on the runners.
  repository:
    - mirror.gcr.io/aquasec/trivy-db:2
    - ghcr.io/aquasecurity/trivy-db:2
    - public.ecr.aws/aquasecurity/trivy-db:2
